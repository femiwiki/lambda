---
name: Deploy
on:
  push:
    branches: [main]
    paths:
      - '*/lambda_function.py'
      - uv.lock
      - .github/workflows/deploy.yml
  workflow_dispatch:
permissions: {}
concurrency:
  group: deploy
jobs:
  plan:
    if: github.repository_owner == 'femiwiki'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: targets
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          all='[
            {"dir": "sns-discord", "function": "sns-discord", "region": "ap-northeast-2"},
            {"dir": "mastodon-discord", "function": "mastodon-discord", "region": "ap-northeast-2"},
            {"dir": "grafana-github", "function": "grafana-github", "region": "ap-northeast-2"},
            {"dir": "bounce-handler", "function": "bounce-handler", "region": "ap-northeast-2"}
          ]'
          changed=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null || echo .github/workflows/deploy.yml)
          if [ "$EVENT" = workflow_dispatch ] || grep -qxE 'uv.lock|.github/workflows/deploy.yml' <<< "$changed"; then
            targets=$(jq -c . <<< "$all")
          else
            dirs=$(cut -d/ -f1 <<< "$changed" | jq -R . | jq -sc .)
            targets=$(jq -c --argjson dirs "$dirs" '[.[] | select(.dir as $d | $dirs | index($d))]' <<< "$all")
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      DIR: ${{ matrix.target.dir }}
      FUNCTION: ${{ matrix.target.function }}
      AWS_REGION: ${{ matrix.target.region }}
      AWS_DEFAULT_REGION: ${{ matrix.target.region }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - run: uv sync --locked
      - run: uv run python -m unittest discover -s "$DIR" -v

      - name: Build
        run: |
          mkdir build
          # A function with its own dependency group ships it; the rest use only the runtime's.
          if uv export --frozen --only-group "$DIR" --no-emit-project -o requirements.txt 2>/dev/null; then
            uv pip install --target build --python-platform aarch64-manylinux2014 \
              --python-version 3.13 --only-binary :all: -r requirements.txt
          fi
          cp "$DIR/lambda_function.py" build/
          cd build && zip -qr ../lambda.zip .

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::302617221463:role/github-lambda
          aws-region: ${{ matrix.target.region }}

      - name: Set the environment of mastodon-discord
        if: matrix.target.dir == 'mastodon-discord'
        env:
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          test -n "$MASTODON_TOKEN" && test -n "$DISCORD_BOT_TOKEN"
          jq -n '{Variables: {
            MASTODON_INSTANCE: "https://mastodon.social",
            MASTODON_TOKEN: env.MASTODON_TOKEN,
            ALLOWED_ACCTS: "lens0021@floss.social",
            CURSOR_PARAMETER: "/mastodon-discord/cursor",
            DISCORD_BOT_TOKEN: env.DISCORD_BOT_TOKEN,
            DISCORD_CHANNEL_ID: "1331968549937479710"
          }}' > environment.json

      - name: Set the environment of sns-discord
        if: matrix.target.dir == 'sns-discord'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          test -n "$WEBHOOK_URL"
          jq -n '{Variables: {WEBHOOK_URL: env.WEBHOOK_URL}}' > environment.json

      - name: Set the environment of grafana-github
        if: matrix.target.dir == 'grafana-github'
        env:
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.ALERTS_APP_PRIVATE_KEY }}
          WEBHOOK_TOKEN: ${{ secrets.ALERTS_WEBHOOK_TOKEN }}
        run: |
          test -n "$GITHUB_APP_PRIVATE_KEY" && test -n "$WEBHOOK_TOKEN"
          jq -n '{Variables: {
            GITHUB_APP_CLIENT_ID: "Iv23liaEFekWQaJiQIF6",
            GITHUB_APP_PRIVATE_KEY: env.GITHUB_APP_PRIVATE_KEY,
            GITHUB_MENTION: "@femiwiki/pager",
            GITHUB_REPOSITORY: "femiwiki/infra",
            WEBHOOK_TOKEN: env.WEBHOOK_TOKEN
          }}' > environment.json

      - name: Set the environment of bounce-handler
        if: matrix.target.dir == 'bounce-handler'
        run: |
          jq -n '{Variables: {
            API_URL: "https://femiwiki.com/api.php",
            TOKEN_PARAMETER: "/mediawiki/bounce_handler/token"
          }}' > environment.json

      - name: Update the configuration
        run: |
          aws lambda wait function-updated --function-name "$FUNCTION"
          args=(--runtime python3.13 --handler lambda_function.lambda_handler)
          if [ -f environment.json ]; then
            args+=(--environment file://environment.json)
          fi
          aws lambda update-function-configuration --function-name "$FUNCTION" "${args[@]}" > /dev/null
          rm -f environment.json
          aws lambda wait function-updated --function-name "$FUNCTION"

      - run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --zip-file fileb://lambda.zip \
            --publish > /dev/null
