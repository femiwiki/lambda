---
name: Lint
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  taplo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: uncenter/setup-taplo@b18c8c8302695fe63d6853bc004006215ac52b91 # v2

      - run: taplo fmt --check

      - run: taplo lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - run: uv sync --locked --group lint
      - run: uv run --frozen --group lint ruff format --check .
      - run: uv run --frozen --group lint ruff check .
      - run: uv run --frozen --group lint ty check .
      - env:
          AWS_DEFAULT_REGION: us-east-1
        run: uv run --frozen python -m unittest discover -s sns-discord -v

  fmt-prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: creyD/prettier_action@8c18391fdc98ed0d884c6345f03975edac71b8f0 # v4.6
        with:
          dry: true
          prettier_options: --check **/*.{md,yaml,yml}
