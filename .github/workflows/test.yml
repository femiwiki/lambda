---
name: Test
on:
  workflow_call:
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - run: uv sync --locked --group lint
      - run: uv run --frozen --group lint ruff format --check .
      - run: uv run --frozen --group lint ruff check .
      - run: uv run --frozen --group lint ty check .
      - env:
          AWS_DEFAULT_REGION: us-east-1
        run: uv run --frozen --with coverage coverage run --append -m unittest discover -s sns-discord -v
      - env:
          AWS_DEFAULT_REGION: ap-northeast-2
        run: uv run --frozen --with coverage coverage run --append -m unittest discover -s mastodon-discord -v
      - env:
          AWS_DEFAULT_REGION: ap-northeast-2
        run: uv run --frozen --with coverage coverage run --append -m unittest discover -s mastodon-boost -v
      - run: uv run --frozen --with coverage coverage run --append -m unittest discover -s grafana-github -v
      - env:
          AWS_DEFAULT_REGION: ap-northeast-2
        run: uv run --frozen --with coverage coverage run --append -m unittest discover -s bounce-handler -v

      - run: uv run --frozen --with coverage coverage xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true

  chart-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: chart-renderer
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # No install scripts run; esbuild finds its binary without its postinstall check
      - run: npm ci --ignore-scripts
      - run: npm test
