---
name: Test
on:
  workflow_call:
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - run: uv sync --locked --group lint
      - run: uv run --frozen --group lint ruff format --check .
      - run: uv run --frozen --group lint ruff check .
      - run: uv run --frozen --group lint ty check .
      - env:
          AWS_DEFAULT_REGION: us-east-1
        run: uv run --frozen python -m unittest discover -s sns-discord -v
      - env:
          AWS_DEFAULT_REGION: ap-northeast-2
        run: uv run --frozen python -m unittest discover -s mastodon-discord -v
      - env:
          AWS_DEFAULT_REGION: ap-northeast-2
        run: uv run --frozen python -m unittest discover -s mastodon-boost -v
      - run: uv run --frozen python -m unittest discover -s grafana-github -v
      - env:
          AWS_DEFAULT_REGION: ap-northeast-2
        run: uv run --frozen python -m unittest discover -s bounce-handler -v
